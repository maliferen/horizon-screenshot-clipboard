[mod]
id = "screenshot_clipboard"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "2ebf00a0281c592f79191e76fce0e7d522c6f425"

[[module]]
id = "threads_os"
file = "crates/horizon-threads/src/lib.rs"
name = "screenshot_clipboard_os"
source = "os.rs"
visibility = "pub"

[[module]]
id = "render_runtime"
file = "crates/horizon-client-render/src/lib.rs"
name = "screenshot_clipboard_runtime"
source = "runtime.rs"
visibility = "pub"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

[[injection]]
id = "chat_add"
kind = "HEAD"
target = "horizon_client_render::chat::Chat::add"
helper = "finish.rs"
bindings = [
  { name = "content", ty = "&horizon_client_core::text::Text", value = "&content" },
]

[[injection]]
id = "layer_post"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_gui_layer_post"
helper = "layer_post.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "layer", ty = "&str", value = "layer" },
  { name = "batch", ty = "&mut crate::hud::HudBatch", value = "&mut *batch" },
]
